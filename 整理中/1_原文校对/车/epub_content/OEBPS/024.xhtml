    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="24" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h1 data-wr-co="365" class="firstTitle"><span data-wr-id="layout" data-wr-co="388">第3章　纯电动汽车</span></h1>
<h2 data-wr-co="404" class="secondTitle" id="sigil_toc_id_3"><span data-wr-id="layout" data-wr-co="448">问题021 纯电动汽车有什么优缺点？</span></h2>
<p data-wr-co="473" class="content"><span data-wr-id="layout" data-wr-co="492">纯电动汽车的优缺点如图3-1所示。</span></p>
<div data-wr-co="515" class="qrbodyPic">
<img data-wr-co="540" alt="" style="max-width: 1121px; max-height: 746px; width: 784px; height: 521.36px;" src="images/lvciw4vksr457oqn43.jpg" data-w="1121px" data-ratio="0.665" data-w-new="746px" />
<p data-wr-co="724" class="imgtitle"><span data-wr-id="layout" data-wr-co="744">图3-1 纯电动汽车优缺点</span></p>
</div>
<p data-wr-co="771" class="content"><span data-wr-id="layout" data-wr-co="790">优点：一方面是环保无污染，在行驶的过程中完全可以做到零排放；另一方面是出行成本低，使用成本远远低于燃油车。此外，电动车的噪声相比于燃油车会低不少，舒适性更为出色。</span></p>
<p data-wr-co="877" class="content"><span data-wr-id="layout" data-wr-co="896">缺点：充电速度慢，补能效率低，影响出行体验；续驶里程不够长，长途出行体验会受到影响；偏远地区的充电设施还不完善，充电不方便。</span></p>
</div></section>
