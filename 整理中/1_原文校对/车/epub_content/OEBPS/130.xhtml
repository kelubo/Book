<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题127 电机一般安装在车上的什么位置？</span></h2>
<p data-wr-co="417" class="content"><span data-wr-id="layout" data-wr-co="436">相比较传统内燃机而言，电机的尺寸和重量都要小很多，因而布置位置也会灵活很多。按照驱动形式来分，前驱车型的电机一般布置在两个前轮中间，后驱车型的电机一般布置在两个后轮中间，四驱车型的两个电机，一个布置在两个前轮之间，另一个布置在两个后轮之间。</span></p>
<p data-wr-co="562" class="content"><span data-wr-id="layout" data-wr-co="581">但也有例外，比如奥迪e-tron S便搭载有三个电机，其中，一个布置在两个前轮之间，另外两个布置在两个后轮之间，如图6-11所示。</span></p>
