<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题069 什么是健康状态(SOH)？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">健康状态(State of Health，SOH)又可以称为“电池健康度”，可以理解为电池当前容量与出厂容量的百分比。</span></p>
<p data-wr-co="499" class="content"><span data-wr-id="layout" data-wr-co="518">拓展阅读</span></p>
<p data-wr-co="528" class="content"><span data-wr-id="layout" data-wr-co="547">除了SOH之外，还有SOE、SOF等专有词汇，其中，能量状态(State of Energy，SOE)可以理解为电池剩余电量，或者对于整车来说是剩余里程的意思；功能状态(State ofFunction，SOF)可以理解为电池的功能状态，是电池控制策略中的一个重要参数。</span></p>
</div></section>
