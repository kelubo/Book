<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题031 纯电动汽车有哪些优化风阻的方法？</span></h2>
<p data-wr-co="418" class="content"><span data-wr-id="layout" data-wr-co="437">为了实现更低的风阻系数，很多纯电动汽车除了采用流线型设计外，还针对细节做出了大量优化。</span></p>
<p data-wr-co="486" class="content"><span data-wr-id="layout" data-wr-co="505">例如，很多车企除了遵循空气动力学设计的基本原则之外，还结合气动、散热、人机布局、仿生等多种设计理念，包括采用空气动力学轮毂设计，搭配车辆侧方的导流腰线，降低风阻；此外，很多电动车采用隐藏式门把手、主动进气格栅等设计，这样也能在一定程度上降低风阻。图3-27所示为特斯拉Model 3上实施的风阻优化措施。</span></p>
