<h1 data-wr-co="365" class="firstTitle"><span data-wr-id="layout" data-wr-co="388">第4章　燃料电池汽车</span></h1>
<h2 data-wr-co="405" class="secondTitle" id="sigil_toc_id_4"><span data-wr-id="layout" data-wr-co="449">问题050 燃料电池汽车有哪些分类？</span></h2>
<p data-wr-co="474" class="content"><span data-wr-id="layout" data-wr-co="493">对于燃料电池汽车上使用的燃料电池，通常可按其电解质类型、工作温度、燃料的来源、燃料的状态、燃料种类、运行机理等进行分类，详见表4-1。其中，主流的燃料电池类型是质子交换膜燃料电池。</span></p>
