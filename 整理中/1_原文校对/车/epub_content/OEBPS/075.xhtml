<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题072 什么是电池密度？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">电池密度一般分为能量密度和功率密度两个维度，如图5-5所示。</span></p>
<div data-wr-co="465" class="qrbodyPic">
<img data-wr-co="490" alt="" style="max-width: 1196px; max-height: 484px; width: 783.372px; height: 317.266px;" src="images/lvciwwd5qfgu1fkb45o.jpg" data-w="1196px" data-ratio="0.405" data-w-new="484px" />
<p data-wr-co="674" class="imgtitle"><span data-wr-id="layout" data-wr-co="694">图5-5 电池密度定义</span></p>
</div>
<p data-wr-co="719" class="content"><span data-wr-id="layout" data-wr-co="738">能量密度又分为质量能量密度和体积能量密度，分别表示从单位质量或者单位体积的蓄电池中所获取的电能，单位分别为W·h/kg和W·h/L，也称为质量比能量和体积比能量。</span></p>
<p data-wr-co="825" class="content"><span data-wr-id="layout" data-wr-co="844">功率密度又分为质量功率密度和体积功率密度，分别表示从单位质量或者单位体积的蓄电池中所获取的输出功率，单位分别为W/kg和W/L，也称为质量比功率和体积比功率。</span></p>
</div></section>
