    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="66" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h1 data-wr-co="365" class="firstTitle"><span data-wr-id="layout" data-wr-co="388">第5章　新能源汽车动力电池</span></h1>
<h2 data-wr-co="408" class="secondTitle" id="sigil_toc_id_5"><span data-wr-id="layout" data-wr-co="452">问题063 电池按能量来源形式如何分类？</span></h2>
<p data-wr-co="479" class="content"><span data-wr-id="layout" data-wr-co="498">电动汽车的动力电池如果按能量来源形式来分类的话，可以分为化学电池、物理电池和生物电池，如图5-1所示。</span></p>
<div data-wr-co="555" class="qrbodyPic">
<img data-wr-co="580" alt="" style="max-width: 1342px; max-height: 805px; width: 783.802px; height: 470.281px;" src="images/lvciwuindvz8i85esg.jpg" data-w="1342px" data-ratio="0.600" data-w-new="805px" />
<p data-wr-co="764" class="imgtitle"><span data-wr-id="layout" data-wr-co="784">图5-1 电池按能量来源形式来分类</span></p>
</div>
<p data-wr-co="815" class="content"><span data-wr-id="layout" data-wr-co="834">(1)化学电池</span></p>
<p data-wr-co="847" class="content"><span data-wr-id="layout" data-wr-co="866">化学电池是将化学能转化为电能的电池，是目前应用最广泛的电池种类。化学电池又可分为一次电池（原电池）、二次电池（蓄电池）及燃料电池。</span></p>
<p data-wr-co="937" class="content"><span data-wr-id="layout" data-wr-co="956">(2)物理电池</span></p>
<p data-wr-co="969" class="content"><span data-wr-id="layout" data-wr-co="988">物理电池是一类内部不发生化学反应的电池，主要包括太阳能电池、飞轮电池等。</span></p>
<p data-wr-co="1030" class="content"><span data-wr-id="layout" data-wr-co="1049">(3)生物电池</span></p>
<p data-wr-co="1062" class="content"><span data-wr-id="layout" data-wr-co="1081">生物电池指的是指将生物质能直接转化为电能的电池。</span></p>
</div></section>
