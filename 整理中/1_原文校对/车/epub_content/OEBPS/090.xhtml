<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题087 锰酸锂电池有什么优缺点？</span></h2>
<p data-wr-co="414" class="content"><span data-wr-id="layout" data-wr-co="433">锰酸锂电池是以尖晶石锰酸锂作为正极材料的锂离子电池，如图5-17所示。标准单体锰酸锂电池额定电压为3.7V，最高充电电压为4.3V，最低放电电压为2V。</span></p>
<p data-wr-co="515" class="content"><span data-wr-id="layout" data-wr-co="534">优点：正极材料成本低、安全性好、低温性能好、价格比三元锂电池低、电压平台高。</span></p>
<p data-wr-co="578" class="content"><span data-wr-id="layout" data-wr-co="597">缺点：正极材料不稳定容易分解产生气体、能量密度较低、高温性能较差、寿命相对短。</span></p>
