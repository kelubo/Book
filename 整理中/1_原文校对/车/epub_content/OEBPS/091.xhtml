    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="91" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题088 磷酸铁锂电池有什么优缺点？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">磷酸铁锂电池是用磷酸铁锂作为正极材料的锂离子电池，标准单体磷酸铁锂电池额定电压为3.2V，最高充电电压为3.65V，最低放电电压为2V。其产品实物如图5-18所示。</span></p>
<p data-wr-co="522" class="content"><span data-wr-id="layout" data-wr-co="541">目前来看，特斯拉Model 3的标准版车型采用的便是磷酸铁锂电池，此外，比亚迪旗下采用刀片电池系列的车型，本质上也都是磷酸铁锂电池。</span></p>
<div data-wr-co="613" class="qrbodyPic">
<img data-wr-co="638" alt="" style="max-width: 672px; max-height: 417px; width: 671.498px; height: 417px;" src="images/lvcix0lvpqif9elg2b.jpg" data-w="672px" data-ratio="0.621" data-w-new="417px" />
<p data-wr-co="822" class="imgtitle"><span data-wr-id="layout" data-wr-co="842">图5-18 磷酸铁锂电池实物</span></p>
</div>
<p data-wr-co="870" class="content"><span data-wr-id="layout" data-wr-co="889">优点：稳定性较好、成本较低，高温性能和使用寿命比三元锂电池更有优势一些。</span></p>
<p data-wr-co="931" class="content"><span data-wr-id="layout" data-wr-co="950">缺点：能量密度较低、低温性能较差、电压平台较低。</span></p>
</div></section>
