<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题145 什么是冷却器(Chiller)？</span></h2>
<p data-wr-co="418" class="content"><span data-wr-id="layout" data-wr-co="437">冷却器(Chiller)是电动汽车电池热管理中的一个重要部件，它一般由一个换热器主体、一个外部蒸发器、两个冷却液管（一进一出）、两个制冷剂管（一进一出）组成。冷却液管内部流动的是动力电池的冷却液，制冷剂管内流动的是空调系统的制冷剂，我们可以粗暴地把换热器主体理解为千层饼，奇数层内流动的为冷却液，偶数层内流动的为制冷剂，两者在流动中进行热量的交换，最终，制冷剂会把冷却液中的热量带走，从而达到给电池降温的作用，如图7-17所示。</span></p>
