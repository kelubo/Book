<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题136 什么是电池系统？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">在一辆电动汽车上，一般除了给电机供电用以驱动车辆的电池之外，还会有一块或者两块低压电池，为了加以区分，通常前者被称为动力电池，也叫做高压电池。电动汽车的电池系统针对的便是高压电池部分，其主要由以下几个部分组成：电池模组（有些车的电池包直接由电芯组成）、电池包壳体、高压电池控制单元、冷却系统、高低压线束等。图7-3所示为奥迪e-tron GT quatrro的电池系统。</span></p>
