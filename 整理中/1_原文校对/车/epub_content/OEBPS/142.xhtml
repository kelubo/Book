<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题139 什么是“电驱四合一”？</span></h2>
<p data-wr-co="413" class="content"><span data-wr-id="layout" data-wr-co="432">“电驱四合一”其实就是在“电驱三合一”的基础上增加一个电机，如图7-7所示，广汽新能源高性能两档双电机“四合一集成电驱”，实现了双电机、控制器和两档变速器的深度集成，可以带来340kW的强劲动力，综合驱动效率达到90%，功率提升13%，体积减小30%，重量减轻25%。</span></p>
