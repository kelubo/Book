<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题173 “过度充电”有什么危害？</span></h2>
<p data-wr-co="414" class="content"><span data-wr-id="layout" data-wr-co="433">与过度放电刚好相反，过度充电是指锂电池实际SOC超过设定保护阈值（如95%）后继续充电，或者电池包充电电压超过截止电压的场景。</span></p>
<p data-wr-co="502" class="content"><span data-wr-id="layout" data-wr-co="521">对于动力电池而言，如果在接近满电后还继续充电，有可能会出现热量在电芯内部大量积累的情况，电池电压会逐渐升高，最终导致电池鼓包起火等现象。过充电流越大，电池发生热失控的时间越短，临界温度越高，区域温差越大，内外部温差越大。这不仅会对电池包电芯造成不可逆的损伤从而影响电池寿命，更容易带来安全隐患。</span></p>
<p data-wr-co="674" class="content"><span data-wr-id="layout" data-wr-co="693">如果此时BMS仍然无法对其保护，则进一步会从单个电芯的热失控进阶到热扩散，最终导致整车起火。</span></p>
