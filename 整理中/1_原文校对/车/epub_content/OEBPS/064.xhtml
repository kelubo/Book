    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="64" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题061 氢燃料电池汽车的用车成本高吗？</span></h2>
<p data-wr-co="417" class="content"><span data-wr-id="layout" data-wr-co="436">与同级别车辆相比，不同动力总成的汽车行驶单位里程所花费的燃料成本如下：汽油车费用约0.9元/公里，柴油车费用约0.56元/公里（约为汽油车的62%），氢燃料电池汽车费用约0.48元/公里（约为汽油车的54%），电动汽车费用约0.32元/公里（约为汽油车的36%），如图4-15所示。</span></p>
<div data-wr-co="583" class="qrbodyPic">
<img data-wr-co="608" alt="" style="max-width: 1172px; max-height: 636px; width: 783.509px; height: 425.445px;" src="images/lvciwtz4l34mi42b58i.jpg" data-w="1172px" data-ratio="0.543" data-w-new="636px" />
<p data-wr-co="792" class="imgtitle"><span data-wr-id="layout" data-wr-co="812">图4-15 不同动力总成汽车的燃料消耗成本对比</span></p>
</div>
<p data-wr-co="849" class="content"><span data-wr-id="layout" data-wr-co="868">整体来看，氢燃料电池汽车的运营成本明显优于内燃机汽车，不过，它的成本略高于电动汽车。但是在目前，氢能行业仍处于早期阶段，随着市场的成熟，氢气供应将增加，价格将下降，而燃料电池汽车的经济效率将继续提高。</span></p>
</div></section>
