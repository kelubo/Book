<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题175 消费者用车还有必要担心过充吗？</span></h2>
<p data-wr-co="417" class="content"><span data-wr-id="layout" data-wr-co="436">不需要担心。电池过充这个问题早在功能设计阶段就已经考虑在内，同时，在电动汽车设计验证以及法规认证阶段也已经进行多次测试，消费者并不需要刻意防止电池过充，大可放心地正常使用。</span></p>
<p data-wr-co="528" class="content"><span data-wr-id="layout" data-wr-co="547">不过，不用特别考虑是一方面，尽可能地延长电池寿命又是另一方面。出于这点考虑，让电池SOC在充电时充至80%～90%这个区间是比较好的推荐，大多数纯电动车型都可以设置该值，在这一SOC区间，电池既能保持在一个舒适的环境下，续驶里程也不至于缩水太多，对延长电池寿命还是很有帮助的。</span></p>
</div></section>
