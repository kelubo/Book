<h1 data-wr-co="365" class="firstTitle"><span data-wr-id="layout" data-wr-co="388">第1章　新能源汽车概述</span></h1>
<h2 data-wr-co="406" class="secondTitle" id="sigil_toc_id_1"><span data-wr-id="layout" data-wr-co="450">问题001 什么是新能源汽车？</span></h2>
<p data-wr-co="472" class="content"><span data-wr-id="layout" data-wr-co="491">依据2020年7月30日中华人民共和国工业和信息化部公布的《工业和信息化部关于修改〈新能源汽车生产企业及产品准入管理规定〉的决定》，新能源汽车是指采用新型动力系统，完全或者主要依靠新型能源驱动的汽车，包括插电式混合动力（含增程式）汽车、纯电动汽车和燃料电池汽车等，如图1-1所示。</span></p>
