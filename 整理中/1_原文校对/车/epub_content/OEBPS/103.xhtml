<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题100 什么是电池包IP防护等级？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">电池包IP防护等级全称为Ingress Protection Rating，指的是电池包的防尘、防水的性能水平，它定义了一个物品对液态和固态微粒的防护能力。IP后面跟了2位数字，第1个是固态防护等级，范围是0～6，分别表示对从大颗粒异物到灰尘的防护；第2个是液态防护等级，范围是0～8，分别表示对从垂直水滴到水底压力情况下的防护。具体见表5-6，数字越大表示能力越强。</span></p>
<div data-wr-co="624" class="qrbodyPic">
<p data-wr-co="649" class="imgtitle"><span data-wr-id="layout" data-wr-co="669">表5-6 IP防护等级</span></p>
<img data-wr-co="686" alt="" style="max-width: 1500px; max-height: 715px; width: 783.445px; height: 373.703px;" src="images/lvcix65mxf3jywudifr.jpg" data-w="1500px" data-ratio="0.477" data-w-new="715px" /></div>
<div data-wr-co="877" class="qrbodyPic">
<p data-wr-co="902" class="imgtitle"><span data-wr-id="layout" data-wr-co="922">（续）</span></p>
<img data-wr-co="931" alt="" style="max-width: 1500px; max-height: 1281px; width: 783.994px; height: 669.531px;" src="images/lvcix6fwj6n1szaqtp.jpg" data-w="1500px" data-ratio="0.854" data-w-new="1281px" /></div>
<p data-wr-co="1123" class="content"><span data-wr-id="layout" data-wr-co="1142">目前，许多新能源汽车的电池包防护等级都做到了IP67，有些做到了更高。</span></p>
