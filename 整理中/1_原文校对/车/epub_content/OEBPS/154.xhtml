<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题151 整车控制器有哪些主要功能？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">整车控制器与汽车行驶、整车驱动、能量回收、电池管理、网络管理、故障诊断与处理、车辆状态监控等密不可分，它实现的功能主要包括行驶控制、能量管理、能量回收、附件管理、故障处理、信息显示、通信管理等7个，如图7-27所示。整体来看，以整车控制器为核心的整车控制系统是一个闭环系统，它能结合各输入信号的反馈不断修正控制误差，以求达到整车动力性、经济性、安全性、舒适性、操作性、可靠性等的均衡。</span></p>
