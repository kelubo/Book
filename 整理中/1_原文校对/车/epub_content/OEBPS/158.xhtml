<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题155 什么是直流/直流变换器(DC/DC)？</span></h2>
<p data-wr-co="421" class="content"><span data-wr-id="layout" data-wr-co="440">在电动汽车上，直流/直流变换器(DC/DC)是一个将高压直流电转为低压直流电的装置，如图7-35所示。</span></p>
<div data-wr-co="497" class="qrbodyPic">
<img data-wr-co="522" alt="" style="max-width: 958px; max-height: 428px; width: 783.575px; height: 350.258px;" src="images/lvcixrskhnu74aehgba.jpg" data-w="958px" data-ratio="0.447" data-w-new="428px" />
<p data-wr-co="706" class="imgtitle"><span data-wr-id="layout" data-wr-co="726">图7-35 DC/DC变换器</span></p>
</div>
<p data-wr-co="754" class="content"><span data-wr-id="layout" data-wr-co="773">在纯电动汽车上，由于没有发动机，整车用电的最终来源也不再是发电机，而是直流电压为几百伏的高压动力电池。但是，车辆上的一些电器设备（如数字仪表、中控屏等）的额定电压是12V、24V或者其他的直流低压，因此，需要DC/DC装置来将高压直流电转为低压直流电，既可以给全车的电器供电，又可以给辅助蓄电池充电。工作流程图如图7-36所示。</span></p>
<div data-wr-co="943" class="qrbodyPic">
<img data-wr-co="968" alt="" style="max-width: 1362px; max-height: 189px; width: 782.655px; height: 108.789px;" src="images/lvcixs002cwzgnxlqhq.jpg" data-w="1362px" data-ratio="0.139" data-w-new="189px" />
<p data-wr-co="1153" class="imgtitle"><span data-wr-id="layout" data-wr-co="1173">图7-36 DC/DC变换器工作流程图</span></p>
</div>
</div></section>
