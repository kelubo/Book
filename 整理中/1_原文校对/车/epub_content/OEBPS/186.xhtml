<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题183 目前“800V快充”有何进展？</span></h2>
<p data-wr-co="417" class="content"><span data-wr-id="layout" data-wr-co="436">目前来看，除了保时捷最早发布了支持800V快充的车型Taycan之外，包括大众、奔驰、奥迪等在内的多家海外品牌/合资品牌，包括比亚迪、长安、长城、岚图等在内的多家自主品牌，以及理想、小鹏、零跑等多家造车新势力品牌，均已经将800V快充技术的开发和应用提上日程并已陆续发布了相关的规划，具体见表8-2。</span></p>
