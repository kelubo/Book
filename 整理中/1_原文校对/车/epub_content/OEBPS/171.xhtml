<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题168 如何区分直流快充口和交流慢充口？</span></h2>
<p data-wr-co="418" class="content"><span data-wr-id="layout" data-wr-co="437">直流快充口和交流慢充口的接口线孔的数量是不同的，孔径大小也不同，如图8-3所示。其中，交流充电枪接口采用的7端子结构（5大孔、2小孔），而直流充电枪则有9个接口（2大孔、1中孔、6小孔）。可以简单地记为：因为直流快充功率大，所以直流快充中间的2个线孔直径要大很多。</span></p>
