<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题028 为什么纯电动汽车要更注重低风阻设计？</span></h2>
<p data-wr-co="420" class="content"><span data-wr-id="layout" data-wr-co="439">对于汽车而言，在行驶过程中的阻力主要包括轮胎滚动阻力、空气阻力、加速阻力和爬坡阻力。如果一辆车是在平直路面匀速行驶的工况下，那么，其能耗主要就用在克服轮胎滚动阻力和空气阻力上面。</span></p>
<p data-wr-co="534" class="content"><span data-wr-id="layout" data-wr-co="553">简单来说，空气阻力就是车辆在行驶时来自空气的阻力，也称为风阻，而汽车的风阻大小会直接影响汽车行驶过程中的能耗水平，其计算公式如图3-20所示。</span></p>
<div data-wr-co="630" class="qrbodyPic">
<img data-wr-co="655" alt="" style="max-width: 1500px; max-height: 223px; width: 782.194px; height: 116.547px;" src="images/lvciwa5j6pr7opek3sh.jpg" data-w="1500px" data-ratio="0.149" data-w-new="223px" />
<p data-wr-co="839" class="imgtitle"><span data-wr-id="layout" data-wr-co="859">图3-20 风阻计算公式</span></p>
</div>
<p data-wr-co="885" class="content"><span data-wr-id="layout" data-wr-co="904">从公式中不难发现，减小迎风面积是优化整车风阻较为有效的手段。其实这个也很好理解，比如我们参加跑步比赛，穿上贴身的跑步服和穿着宽松的运动服去跑，得到的成绩是完全不一样的。</span></p>
</div></section>
