<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题146 什么是PTC加热器？</span></h2>
<p data-wr-co="412" class="content"><span data-wr-id="layout" data-wr-co="431">PTC是Positive Temperature Coefficient的缩写，指的是正温度系数热敏电阻。在电动汽车上，PTC加热器在通电之后产生大量的热量以提供给电动汽车进行制热。图7-18所示为大众e-Golf的PTC加热器。</span></p>
