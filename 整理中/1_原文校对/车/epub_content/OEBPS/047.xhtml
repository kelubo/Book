<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题044 纯电动汽车是如何调节车速的？</span></h2>
<p data-wr-co="416" class="content"><span data-wr-id="layout" data-wr-co="435">纯电动汽车的车速调节，其实是通过加速踏板踩踏深度的变化来实现的。具体来看，驾驶员踩下加速踏板之后，加速踏板位置传感器检测加速踏板的位移量（被踩下去的深度）并将其转化为数字信号输入给控制器，控制器根据踏板位移量计算转矩需求后输入给MCU，MCU控制电机输出对应的转矩，再经过减速器输出之后，电机动力输出的变化便会传递到驱动轮上，最终使汽车的速度产生变化。踏板踩得越深，输出的转矩便越大。这就像赶马车，鞭子打得越用力，马的反应越强烈，使的劲就会越大，跑得便会越快。纯电动汽车调速原理如图3-52所示。</span></p>
