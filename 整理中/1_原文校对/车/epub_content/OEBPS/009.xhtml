<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题006 什么是纯电动汽车？</span></h2>
<p data-wr-co="411" class="content"><span data-wr-id="layout" data-wr-co="430">纯电动汽车(Battery Electric Vehicle，BEV)顾名思义就是只采用电力驱动的汽车，车辆的动力源是可充电的动力电池。相比于传统内燃机汽车而言，纯电动汽车取消了内燃机，其工作原理如图1-9所示。</span></p>
<div data-wr-co="542" class="qrbodyPic">
<img data-wr-co="567" alt="" style="max-width: 1176px; max-height: 909px; width: 783.959px; height: 606px;" src="images/lvcivt82t6cz7sxwm49.jpg" data-w="1176px" data-ratio="0.773" data-w-new="909px" />
<p data-wr-co="751" class="imgtitle"><span data-wr-id="layout" data-wr-co="771">图1-9 纯电动汽车动力示意图</span></p>
</div>
<p data-wr-co="800" class="content"><span data-wr-id="layout" data-wr-co="819">由于纯电动汽车只需充电不烧油，汽车本身不存在尾气排放带来的污染等问题，因而被视为是新能源汽车的趋势。图1-10所示为纯电动汽车的代表车型奥迪e-tron。</span></p>
<div data-wr-co="902" class="qrbodyPic">
<img data-wr-co="927" alt="" style="max-width: 1236px; max-height: 661px; width: 783.689px; height: 419.273px;" src="images/lvcivth08ucvoeesxjh.jpg" data-w="1236px" data-ratio="0.535" data-w-new="661px" />
<p data-wr-co="1111" class="imgtitle"><span data-wr-id="layout" data-wr-co="1131">图1-10 纯电动汽车代表车型奥迪e-tron</span></p>
</div>
</div></section>
