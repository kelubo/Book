<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题157 什么是SiC？</span></h2>
<p data-wr-co="409" class="content"><span data-wr-id="layout" data-wr-co="428">SiC一般指碳化硅，是用石英砂、石油焦（或煤焦）、木屑（生产绿色碳化硅时需要加食盐）等原料通过电阻炉高温冶炼而成。在当下，由于电控的高集成化和高效率的趋势之下，纯电动汽车上的各种功率模块被要求向低损耗、低热阻、小封装、长寿命、高拓展性等方向发展，应运而生的SiC，被称为是“新能源汽车下一代功率器件的核心”。图7-39所示为比亚迪半导体SiC功率模块。</span></p>
