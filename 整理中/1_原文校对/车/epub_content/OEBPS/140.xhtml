    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="140" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题137 什么是电驱系统？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">电驱系统由3个部分构成：驱动电机、电机控制器和电机减速器，如图7-4所示。</span></p>
<div data-wr-co="472" class="qrbodyPic">
<img data-wr-co="497" alt="" style="max-width: 938px; max-height: 226px; width: 783.779px; height: 188.891px;" src="images/lvcixjk8pszqwftnfkr.jpg" data-w="938px" data-ratio="0.241" data-w-new="226px" />
<p data-wr-co="681" class="imgtitle"><span data-wr-id="layout" data-wr-co="701">图7-4 纯电动汽车电驱系统构成</span></p>
</div>
<p data-wr-co="731" class="content"><span data-wr-id="layout" data-wr-co="750">纯电动汽车的电机有交流异步电机和永磁同步电机等多种类型，每个电机都可以正转和反转，正转为前进，反转为倒车；电机控制器是控制电机按照设定的方向、速度、响应时间进行工作的集成控制器；电机减速器的作用可以类比为传统燃油车的变速器。目前国内外大部分电动汽车的传动机构都是单级减速器，也就不需要离合器，也不需要变速，这也是为什么电动汽车不会有D1、D2、D3甚至D4、D5、D6这样的档位。这样的设计可以在满足性能的前提下，降低集成复杂度，同时也降低成本。</span></p>
</div></section>
