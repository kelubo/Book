<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题081 什么是铅酸电池？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">铅酸电池是一种电极主要由铅及其氧化物制成、电解液是硫酸溶液的蓄电池，其结构形式如图5-12所示。</span></p>
<div data-wr-co="483" class="qrbodyPic">
<img data-wr-co="508" alt="" style="max-width: 1183px; max-height: 789px; width: 783.932px; height: 522.883px;" src="images/lvciwyrg8wq4ailpmhp.jpg" data-w="1183px" data-ratio="0.667" data-w-new="789px" />
<p data-wr-co="693" class="imgtitle"><span data-wr-id="layout" data-wr-co="713">图5-12 铅酸电池结构示意图</span></p>
</div>
<p data-wr-co="742" class="content"><span data-wr-id="layout" data-wr-co="761">放电状态下，铅酸电池的正极主要成分为二氧化铅，负极主要成分为铅；充电状态下，正负极的主要成分均为硫酸铅。一个单体铅酸电池的额定电压是2.0V，最高充电电压2.4V，最低放电电压1.5V。在应用中，经常用6个单体铅酸电池串联起来组成标称是12V的铅酸电池，另外也还有24V、36V、48V等多种规格。</span></p>
<p data-wr-co="916" class="content"><span data-wr-id="layout" data-wr-co="935">优点：成本低、低温性好、性价比高、安全性好、适用性好、回收率高。</span></p>
<p data-wr-co="973" class="content"><span data-wr-id="layout" data-wr-co="992">缺点：能量密度低、循环寿命短、体积大、重量大、有一定的污染性。</span></p>
</div></section>
