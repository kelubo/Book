<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题038 为什么多数纯电动汽车后排中部没有“凸起”？</span></h2>
<p data-wr-co="423" class="content"><span data-wr-id="layout" data-wr-co="442">多数燃油车在后排中间存在凸起，主要是为排气管和传动轴避让空间，如图3-43所示。而主流纯电动汽车电池包基本都是布置在车底，没有燃油车的排气系统；对于四驱纯电动汽车而言，也基本都是通过前轴和后轴各布置一台电机来实现，不需要传动轴（极少数电机前置后轮驱动的车型除外）。因此，大多数纯电动汽车后排中间基本没有凸起了，如图3-44所示。</span></p>

<p data-wr-co="821" class="imgtitle"><span data-wr-id="layout" data-wr-co="841">图3-43 燃油车后排中部的车身凸起特征（奥迪A8）</span></p>
