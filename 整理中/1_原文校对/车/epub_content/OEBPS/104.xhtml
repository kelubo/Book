    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="104" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题101 为什么不同厂家的电池包不能通用？</span></h2>
<p data-wr-co="418" class="content"><span data-wr-id="layout" data-wr-co="437">首先，电池包的外轮廓边界受限于车身结构，每个厂家的车身结构都不一样，故而电池包的尺寸无法统一。</span></p>
<p data-wr-co="490" class="content"><span data-wr-id="layout" data-wr-co="509">其次，电池包的容量会影响到空间、成本、安全、性能等，每个厂家的电池包的容量不一样，尺寸因而也会存在不小的差异。</span></p>
<p data-wr-co="570" class="content"><span data-wr-id="layout" data-wr-co="589">此外，考虑到碰撞安全的要求，对于碰撞后的传力路径，每个厂家运用的安全策略是不一样的，电池包所应用的结构设计也不一样，电池包与车身的连接关系也不一样。图5-36所示为奥迪e-tron 55的电池包与车身连接关系示意图。</span></p>
<div data-wr-co="703" class="qrbodyPic">
<img data-wr-co="728" alt="" style="max-width: 1318px; max-height: 892px; width: 783.743px; height: 530.594px;" src="images/lvcix6o4k51n7bme9ue.jpg" data-w="1318px" data-ratio="0.677" data-w-new="892px" />
<p data-wr-co="913" class="imgtitle"><span data-wr-id="layout" data-wr-co="933">图5-36 电池包与车身连接关系示意图</span></p>
</div>
<p data-wr-co="966" class="content"><span data-wr-id="layout" data-wr-co="985">也因此，对于不同厂家来说，电池包通用的概率非常小。</span></p>
</div></section>
