<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题071 什么是电池能量？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">电池能量是在一定的放电条件下电池所输出的电能，单位通常是W·h或者kW·h，其定义见表5-2。</span></p>
<div data-wr-co="482" class="qrbodyPic">
<p data-wr-co="507" class="imgtitle"><span data-wr-id="layout" data-wr-co="527">表5-2 电池能量定义</span></p>
<img data-wr-co="544" alt="" style="max-width: 1500px; max-height: 469px; width: 783.147px; height: 245.125px;" src="images/lvciww38v93lvz9yxxk.jpg" data-w="1500px" data-ratio="0.313" data-w-new="469px" /></div>
<p data-wr-co="734" class="content"><span data-wr-id="layout" data-wr-co="753">之所以说电池容量并不代表电池所储存的能量，是因为电池储存的能量除了与它的容量相关之外，还和放电电压有关。</span></p>
<p data-wr-co="811" class="content"><span data-wr-id="layout" data-wr-co="830">举个例子：某锂电池容量只有750mA·h，但是它的电压是3.7V，所以它实际上的能量是容量乘以电压，拥有2775mW·h的能量；再看某镍氢电池，虽然容量有1900mA·h，但是其电压只有1.2V，算出来实际能量是2280mW·h，也就是说不如拥有2775mW·h能量的锂电池。</span></p>
</div></section>
