<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题017 混联式插电混合动力汽车有什么优缺点？</span></h2>
<p data-wr-co="420" class="content"><span data-wr-id="layout" data-wr-co="439">有人可能会认为，兼顾串并联两种结构的混联式插电混合动力系统应该是集大成者了。但这么说也并不全面。</span></p>
<p data-wr-co="493" class="content"><span data-wr-id="layout" data-wr-co="512">从基本特性上来讲，混联式插电混合动力汽车确实做到了对两者优势的兼顾，既能在大多数工况下保证驱动系统的高效表现，还能做到在特殊工况下发动机直接驱动车辆行驶。具体来看，比亚迪旗下车型搭载的DM-i技术，便是混联式插电混合动力系统，如图2-18所示。</span></p>
<p data-wr-co="640" class="content"><span data-wr-id="layout" data-wr-co="659">这类车型的缺点是，由于动力系统过于复杂，所以成本较高；另外，由于搭载的零部件更多了，车辆的自重也会有一定的增加。</span></p>
