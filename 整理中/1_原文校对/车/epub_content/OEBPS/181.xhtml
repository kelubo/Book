    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="181" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题178 电池反复充电会过热从而引发火灾或者爆炸吗？</span></h2>
<p data-wr-co="423" class="content"><span data-wr-id="layout" data-wr-co="442">一般而言，反复充电的情况下，引起过热的概率并不算高。</span></p>
<p data-wr-co="474" class="content"><span data-wr-id="layout" data-wr-co="493">现如今，电池生产一致性以及电池管理系统的程序设定已经比较成熟，安全系数已经可以保持在较高水准，而且完善的冷却系统是电动汽车的必备设计，在实际充电过程中，一直都会有冷却系统在工作，特殊情况下甚至会开启空调压缩机通过制冷剂为电池降温。即便是上述冷却方式全部失效而导致温度过高时，电池管理系统也会停止充电，从而不太容易到起火爆炸的那一步。</span></p>
</div></section>
