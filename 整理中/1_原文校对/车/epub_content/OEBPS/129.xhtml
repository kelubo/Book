<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题126 什么是轮边电机？</span></h2>
<p data-wr-co="410" class="content"><span data-wr-id="layout" data-wr-co="429">轮边电机是指轮毂和电机是独立状态、电机装在车轮边上以单独驱动该车轮。此时，电机不是集成在车轮内，而是通过电机输出轴连接到车轮，这也是轮边电机和轮毂电机的最大差异点，如图6-10所示。</span></p>
