<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题085 不同类型电池的主要性能指标有何差别？</span></h2>
<p data-wr-co="420" class="content"><span data-wr-id="layout" data-wr-co="439">不同类型电池的主要性能指标对比见表5-4，整体来看，无论是体积能量密度还是质量能量密度，锂电池都要比铅酸电池、镍镉电池、镍氢电池更有优势，当然，对比燃料电池而言还存在极大的差距。</span></p>
