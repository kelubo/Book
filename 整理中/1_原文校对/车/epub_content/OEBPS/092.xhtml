<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题089 三元锂电池有什么优缺点？</span></h2>
<p data-wr-co="414" class="content"><span data-wr-id="layout" data-wr-co="433">三元锂电池是指采用镍钴锰或者镍钴铝三种过渡金属氧化物为正极材料的锂电池。其正极材料是以镍盐、钴盐、锰盐为原料，里面镍钴锰的比例可以根据实际需要调整，单体三元锂电池标称电压3.6～3.7V，最高充电电压为4.2V，最低放电电压为2.75～3.0V，如图5-19所示。</span></p>
<p data-wr-co="571" class="content"><span data-wr-id="layout" data-wr-co="590">三元锂电池是目前许多主流车企旗下车型采用的方案，代表车型有奔驰EQS、奥迪e-tron、小鹏P7、蔚来ES8、沃尔沃C40等。</span></p>
<p data-wr-co="659" class="content"><span data-wr-id="layout" data-wr-co="678">优点：电压平台高、能量密度大、电池容量高，低温时电池更加稳定，适合北方天气。</span></p>
<p data-wr-co="722" class="content"><span data-wr-id="layout" data-wr-co="741">缺点：安全性较差、循环寿命较短。</span></p>
