<h1 data-wr-co="365" class="firstTitle"><span data-wr-id="layout" data-wr-co="388">第6章　新能源汽车驱动电机</span></h1>
<h2 data-wr-co="408" class="secondTitle" id="sigil_toc_id_6"><span data-wr-id="layout" data-wr-co="452">问题119 新能源汽车驱动电机有哪些主要的性能指标？</span></h2>
<p data-wr-co="485" class="content"><span data-wr-id="layout" data-wr-co="504">电机是将电能与机械能进行相互转换的一种电力部件，在选购电动汽车的时候，我们经常会看到诸如峰值功率（或电机最大功率）、峰值转矩（或电机最大转矩）等参数，除此之外，电机还有一些其他的主要性能参数，见表6-1。</span></p>
