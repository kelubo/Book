<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题023 为什么纯电动汽车的制动片十分耐用？</span></h2>
<p data-wr-co="419" class="content"><span data-wr-id="layout" data-wr-co="438">纯电动汽车的制动片十分耐用并不是因为用的材质好，而是制动力可以由另外一个部件产生，那便是驱动电机。</span></p>
<p data-wr-co="493" class="content"><span data-wr-id="layout" data-wr-co="512">从构造和原理上来说，电动机和发电机基本上没有差异，所以，在做电驱动功能设计时，通过电机控制器就可以将电机的电动模式切换到发电模式，就可以顺利地将车辆行驶的动能转化为电能。如此一来，在制动能量回收时，大部分的制动力不是变成制动盘上的热能，而是在电动机转换为发电机之后通过能量回收进入了电池包，在整体续驶里程增加的同时，制动片损耗也降低了。能量回收的过程如图3-5所示。</span></p>
