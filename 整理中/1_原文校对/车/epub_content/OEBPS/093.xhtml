<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题090 不同锂电池的主要性能指标有何差别？</span></h2>
<p data-wr-co="419" class="content"><span data-wr-id="layout" data-wr-co="438">不同种类的锂电池性能和参数都是不一样的，表5-5总结了一些相关参数。</span></p>
<div data-wr-co="478" class="qrbodyPic">
<p data-wr-co="503" class="imgtitle"><span data-wr-id="layout" data-wr-co="523">表5-5 不同锂电池的主要性能指标对比</span></p>
<img data-wr-co="548" alt="" style="max-width: 1500px; max-height: 681px; width: 783.986px; height: 355.93px;" src="images/lvcix16lct6xrg93i9.jpg" data-w="1500px" data-ratio="0.454" data-w-new="681px" /></div>
<div data-wr-co="739" class="qrbodyPic">
<p data-wr-co="764" class="imgtitle"><span data-wr-id="layout" data-wr-co="784">（续）</span></p>
<img data-wr-co="793" alt="" style="max-width: 1500px; max-height: 699px; width: 783.999px; height: 365.344px;" src="images/lvcix1nc3utl24vwf37.jpg" data-w="1500px" data-ratio="0.466" data-w-new="699px" /></div>
<p data-wr-co="984" class="content"><span data-wr-id="layout" data-wr-co="1003">其中，磷酸铁锂电池和三元锂电池是全球电动车行业的两大主流电池技术路线。磷酸铁锂电池因为寿命更长、成本更低，在中低续驶里程车型中得到广泛的应用；而三元锂电池因为能量密度高、整车电耗低，主要在中高续驶里程车型中应用。</span></p>
<p data-wr-co="1115" class="content"><span data-wr-id="layout" data-wr-co="1134">根据当前市场实际使用情况来看，在未来很长一段时间内，磷酸铁锂电池、三元锂电池这两种技术路线仍将并行发展。对比来看，磷酸铁锂电池的安全性大家已相对认可，但三元锂电池的安全目前仍然是行业公认的痛点和难点。</span></p>
