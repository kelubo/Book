    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="71" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题068 什么是荷电状态(SOC)？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">荷电状态(State of Charge，SOC)代表的是使用一段时间或长期搁置不用后的剩余容量与电池额定容量的比值，类似于燃油车油箱内的现有油量和油箱容积的比值，常用百分数表示。其取值范围也可以是0～1，当SOC=0时表示电池放电完全，没电了；当SOC=1时表示电池充电完全，电池充满电了。</span></p>
<p data-wr-co="586" class="content"><span data-wr-id="layout" data-wr-co="605">SOC的准确性对于汽车的安全稳定运行非常重要，当SOC值不准确时，会使电动汽车的电池管理系统产生误判，从而影响汽车的整体运营，有可能降低汽车的续驶里程，甚至产生危险。</span></p>
</div></section>
