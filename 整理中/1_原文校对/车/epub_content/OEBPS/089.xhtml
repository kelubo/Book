<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题086 锂电池有哪些分类？</span></h2>
<p data-wr-co="411" class="content"><span data-wr-id="layout" data-wr-co="430">目前市面上主流的锂电池主要有三种：锰酸锂电池、磷酸铁锂电池、三元聚合物锂电池（简称为“三元锂电池”），如图5-16所示。</span></p>
<div data-wr-co="496" class="qrbodyPic">
<img data-wr-co="521" alt="" style="max-width: 1216px; max-height: 289px; width: 782.891px; height: 186.328px;" src="images/lvcix05mapqkqhzij2u.jpg" data-w="1216px" data-ratio="0.238" data-w-new="289px" />
<p data-wr-co="706" class="imgtitle"><span data-wr-id="layout" data-wr-co="726">图5-16 三种主流锂电池</span></p>
</div>
<p data-wr-co="753" class="content"><span data-wr-id="layout" data-wr-co="772">不同锂电池的区别主要在于正极活性材料的差异。在我们的日常生活中，时时刻刻都有锂电池的存在，我们生活中用到的手机、电脑、电动自行车、充电宝等，都使用锂电池。</span></p>
</div></section>
