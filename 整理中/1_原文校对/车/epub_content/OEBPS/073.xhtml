<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题070 什么是放电深度(DoD)？</span></h2>
<p data-wr-co="415" class="content"><span data-wr-id="layout" data-wr-co="434">放电深度(Depth of Discharge，DoD)是电池放电量与电池额定容量的比值。电池的放电深度可以用来衡量已经释放出来的电量，通常用百分比来表达，其取值范围为0%～100%，如图5-4所示。</span></p>
<div data-wr-co="540" class="qrbodyPic">
<img data-wr-co="565" alt="" style="max-width: 1228px; max-height: 344px; width: 784px; height: 219.52px;" src="images/lvciwvs25f6qb72quv9.jpg" data-w="1228px" data-ratio="0.280" data-w-new="344px" />
<p data-wr-co="749" class="imgtitle"><span data-wr-id="layout" data-wr-co="769">图5-4 放电深度DoD</span></p>
</div>
<p data-wr-co="795" class="content"><span data-wr-id="layout" data-wr-co="814">当DoD=100%时表示完全放电完毕，此时荷电状态为0，电池包内为没电状态；当DoD=0%时表示还未开始放电，此时荷电状态为1，电池包内为满电状态。当一个电池达到80%的DoD时，意味着电池包被充满电之后，放掉了80%的电量，此时就算是深度放电了。</span></p>
</div></section>
