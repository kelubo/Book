<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题008 什么是燃料电池汽车？</span></h2>
<p data-wr-co="412" class="content"><span data-wr-id="layout" data-wr-co="431">燃料电池汽车(Fuel Cell Electric Vehicle，FCEV)通常以氢气、甲醇等为燃料，通过化学反应产生电能驱动电机进行工作，电机产生的机械能经过变速传动装置传给驱动轮，从而驱动车辆行驶。其工作原理如图1-13所示。</span></p>
<div data-wr-co="553" class="qrbodyPic">
<img data-wr-co="578" alt="" style="max-width: 1172px; max-height: 909px; width: 783.586px; height: 608.062px;" src="images/lvcivu36cg7pdqjt8il.jpg" data-w="1172px" data-ratio="0.776" data-w-new="909px" />
<p data-wr-co="762" class="imgtitle"><span data-wr-id="layout" data-wr-co="782">图1-13 燃料电池汽车动力示意图</span></p>
</div>
<p data-wr-co="813" class="content"><span data-wr-id="layout" data-wr-co="832">氢燃料电池汽车的最终排放物只有水，而且，在其行驶过程中，还可净化空气，为解决环保问题带来了新的可能。图1-14所示为氢燃料电池汽车的代表车型现代NEXO，图1-15所示为现代NEXO的动力系统构成。</span></p>
<div data-wr-co="937" class="qrbodyPic">
<img data-wr-co="962" alt="" style="max-width: 1096px; max-height: 475px; width: 784px; height: 339.472px;" src="images/lvcivuaah6i63kzb9gh.jpg" data-w="1096px" data-ratio="0.433" data-w-new="475px" />
<p data-wr-co="1146" class="imgtitle"><span data-wr-id="layout" data-wr-co="1166">图1-14 氢燃料电池汽车代表车型现代NEXO</span></p>
</div>
<div data-wr-co="1203" class="qrbodyPic">
<img data-wr-co="1228" alt="" style="max-width: 1156px; max-height: 702px; width: 784px; height: 475.888px;" src="images/lvcivuhjzgp9yrhlgjq.jpg" data-w="1156px" data-ratio="0.607" data-w-new="702px" />
<p data-wr-co="1412" class="imgtitle"><span data-wr-id="layout" data-wr-co="1432">图1-15 现代NEXO动力系统构成</span></p>
</div>
