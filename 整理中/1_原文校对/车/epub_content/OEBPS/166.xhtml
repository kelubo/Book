<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题163 纯电动汽车的高压线是如何分布的？</span></h2>
<p data-wr-co="418" class="content"><span data-wr-id="layout" data-wr-co="437">在电动汽车上有一套高压配电系统，系统电能传输的高压线束主要由五段组成，分别是动力电池高压线束、快充线束、电机控制器高压线束、慢充线束和高压附件线束，如图7-53所示。五段高压线束把动力电池的高压电分配给电机控制器、驱动电机、电动空调压缩机、PTC加热器、DC/DC等高压用电设备，同时将交流、直流充电接口高压充电电流分配给动力电池，以便为动力电池充电，如图7-54所示。</span></p>
