<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题016 并联式插电混合动力汽车有哪些工作模式？</span></h2>
<p data-wr-co="421" class="content"><span data-wr-id="layout" data-wr-co="440">从驱动模式来看，并联式插电混合动力汽车与串联式插电混合动力汽车的工作模式基本一样，都具有纯电、纯燃油、油电混合三种驱动模式，如图2-15～图2-17所示。</span></p>
<div data-wr-co="523" class="qrbodyPic">
<img data-wr-co="548" alt="" style="max-width: 1316px; max-height: 1050px; width: 783.874px; height: 625.531px;" src="images/lvciw10qhh9ohgps4cr.jpg" data-w="1316px" data-ratio="0.798" data-w-new="1050px" />
<p data-wr-co="733" class="imgtitle"><span data-wr-id="layout" data-wr-co="753">图2-15 并联式混合动力汽车-纯燃油驱动工作模式</span></p>
</div>
<div data-wr-co="792" class="qrbodyPic">
<img data-wr-co="817" alt="" style="max-width: 1316px; max-height: 1049px; width: 784px; height: 624.848px;" src="images/lvciw19obrrwonibkn8.jpg" data-w="1316px" data-ratio="0.797" data-w-new="1049px" />
<p data-wr-co="1002" class="imgtitle"><span data-wr-id="layout" data-wr-co="1022">图2-16 并联式混合动力汽车-纯电驱动工作模式</span></p>
</div>
<div data-wr-co="1060" class="qrbodyPic">
