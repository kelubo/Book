    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="121" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题118 电池的技术瓶颈究竟在哪？</span></h2>
<p data-wr-co="414" class="content"><span data-wr-id="layout" data-wr-co="433">电池的主要技术瓶颈还是在于材料方面。</span></p>
<p data-wr-co="457" class="content"><span data-wr-id="layout" data-wr-co="476">对于车规级的动力电池而言，运行环境和安全属性的高要求使得可选择的电池材料并不多，同时，消费品的属性让电动汽车采用的电池成本不能太高。这也是聚合物、石墨烯等电池虽然有着更显著的容量以及充放电特性上的优势，但至今仍未能在电动汽车领域大规模使用的原因。</span></p>
<p data-wr-co="605" class="content"><span data-wr-id="layout" data-wr-co="624">因此，动力电池领域的下个风口突破点还是材料，例如固态电池、锂硫电池或者是凝胶电池等，只要是能突破目前电池局限的电池类型，都有可能成为下一代电动汽车动力电池的核心，当然，前提是攻克了安全和成本这两个老大难问题。</span></p>
</div></section>
