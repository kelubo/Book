<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题128 为什么电机的起步速度非常快？</span></h2>
<p data-wr-co="416" class="content"><span data-wr-id="layout" data-wr-co="435">电机的起步速度非常快，主要便是因为电机在刚起步低转速时便可以获得高转矩，而之所以有这样的转矩特性，是因为电机的定子和转子之间，两者都是相互独立的，没有任何的物理接触，当转子感受到磁场旋转时，内部是没有受到阻力的，可以很快地达到最大转矩。这就有点像磁悬浮列车和普通列车的对比，磁悬浮列车与导轨是不接触的，可以很快地达到我们想要的速度，而普通列车是通过轮子与导轨相接触，起步时需要先克服轮子和导轨的摩擦力，然后再进一步加速才能到达我们想要的速度。</span></p>
