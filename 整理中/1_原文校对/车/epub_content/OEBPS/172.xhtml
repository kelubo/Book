    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="172" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题169 直流快充充电桩和交流慢充充电桩有何区别？</span></h2>
<p data-wr-co="422" class="content"><span data-wr-id="layout" data-wr-co="441">相比较于交流慢充充电桩而言，直流充电桩的体积会显得十分庞大，原因在于其相较交流充电桩多出了交流电转直流电的整流斩波模块，如图8-4所示。此外，在外观上我们还可以通过充电线粗细区别两者，由于直流充电桩输出电流大，直流充电线会粗壮许多。</span></p>
<div data-wr-co="563" class="qrbodyPic">
<img data-wr-co="588" alt="" style="max-width: 966px; max-height: 485px; width: 784px; height: 393.568px;" src="images/lvciy090zlh1957xqom.jpg" data-w="966px" data-ratio="0.502" data-w-new="485px" />
<p data-wr-co="772" class="imgtitle"><span data-wr-id="layout" data-wr-co="792">图8-4 交流慢充充电桩和直流快充充电桩差异对比图</span></p>
</div>
<p data-wr-co="831" class="content"><span data-wr-id="layout" data-wr-co="850">目前在国内，大部分交流充电桩的功率是3.5kW和7kW，大部分直流充电桩的功率是35kW和60kW，且其直流充电模块以5kW、7.5kW和10kW为主，以8个模块并联输出为上限，最大也只能做到80kW。</span></p>
</div></section>
