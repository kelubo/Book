    <section xmlns="http://www.w3.org/1999/xhtml" data-book-id="3300071984" data-chapter-uid="180" class="readerChapterContent"><div data-wr-bd="1" data-wr-co="357">
<h2 data-wr-co="365" class="secondTitle"><span data-wr-id="layout" data-wr-co="389">问题177 充电速度到底是被什么因素限制住了？</span></h2>
<p data-wr-co="419" class="content"><span data-wr-id="layout" data-wr-co="438">在当下，电动汽车普及的阻碍之一便是充电速度慢，而充电速度又与电池特性、电池容量、外围设备这三个方面的因素有关，如图8-10所示。</span></p>
<div data-wr-co="508" class="qrbodyPic">
<img data-wr-co="533" alt="" style="max-width: 1500px; max-height: 594px; width: 783.992px; height: 310.461px;" src="images/lvciy22gp6vkt25pxaf.jpg" data-w="1500px" data-ratio="0.396" data-w-new="594px" />
<p data-wr-co="718" class="imgtitle"><span data-wr-id="layout" data-wr-co="738">图8-10 充电速度的三大影响因素</span></p>
</div>
<p data-wr-co="769" class="content"><span data-wr-id="layout" data-wr-co="788">简单来说，给电动汽车动力电池充电就像是拿水桶打水一样，如果水池小，而且水流速度大，自然耗时会越短，反之耗时就越长，如图8-11所示。</span></p>
<div data-wr-co="860" class="qrbodyPic">
<img data-wr-co="885" alt="" style="max-width: 1280px; max-height: 691px; width: 783.767px; height: 423.234px;" src="images/lvciy2b5tb3b1l40aa.jpg" data-w="1280px" data-ratio="0.540" data-w-new="691px" />
<p data-wr-co="1070" class="imgtitle"><span data-wr-id="layout" data-wr-co="1090">图8-11 水桶打水示意图</span></p>
</div>
</div></section>
